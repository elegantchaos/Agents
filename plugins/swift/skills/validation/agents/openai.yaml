interface:
  display_name: "Swift Validation"
  short_description: "Run standard post-change format/lint/build/test validation"
  icon_small: "./assets/validation-icon.svg"
  icon_large: "./assets/validation-icon.png"
  brand_color: "#1A1A1A"
  default_prompt: "From the repository root, run `agt format` and `agt validate --fast` during development. Before merging a PR, require a passing full `agt validate` for its final head and record the result on the PR. Report passes, failures, skips, and residual risks."
